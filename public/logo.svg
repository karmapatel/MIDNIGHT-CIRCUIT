<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Red-Anodized Chrome Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="35%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#ff2e51" />
    </linearGradient>

    <!-- Polished Silver Chrome Rim -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#cbd5e1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9" />
    </linearGradient>

    <!-- Dark Carbon Mesh Dial Background -->
    <radialGradient id="dialBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Silver Metallic GT Text Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Fiery Crimson GT-R Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Carbon Fiber Weave Pattern -->
    <pattern id="carbonPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0b0f19" />
      <path d="M0 0h4v4H0zM4 4h4v4H4z" fill="#141c2e" />
      <path d="M0 4h4v4H0zM4 0h4v4H4z" fill="#090d15" />
    </pattern>

    <!-- Emblem Glow Shadow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#e11d48" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Dark Outer Backing Circle -->
  <circle cx="256" cy="256" r="250" fill="#020617" />

  <!-- Outer Anodized Crimson Red Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="22" filter="url(#badgeGlow)" />

  <!-- Inner Polished Chrome Rim -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#chromeGrad)" stroke-width="6" opacity="0.9" />

  <!-- Carbon Fiber Mesh Dial Surface -->
  <circle cx="256" cy="256" r="218" fill="url(#dialBg)" />
  <circle cx="256" cy="256" r="218" fill="url(#carbonPattern)" opacity="0.65" />

  <!-- Dial Fine Inner Ring Accent -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- "GT" Silver Metallic Top Text -->
  <g fill="url(#silverGrad)">
    <text x="256" y="215" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="112" font-weight="900" text-anchor="middle" letter-spacing="16" style="paint-order: stroke fill; stroke: #020617; stroke-width: 5px; stroke-linejoin: round;">GT</text>
  </g>

  <!-- "R" Bold Crimson Metallic Center Text -->
  <g fill="url(#redGrad)">
    <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="190" font-weight="900" text-anchor="middle" style="paint-order: stroke fill; stroke: #4c0519; stroke-width: 8px; stroke-linejoin: round;">R</text>
    <!-- GT-R Red Underline Accent Bar -->
    <rect x="156" y="405" width="200" height="18" rx="9" fill="url(#redGrad)" stroke="#4c0519" stroke-width="2" />
  </g>
</svg>
